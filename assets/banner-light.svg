    .node { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .core { fill: #0596ad; animation: blink 2.1s ease-in-out infinite; }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.35; } 80% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .bar, .pulse, .core { animation: none; } .bar { transform: scaleY(0.75); } }
