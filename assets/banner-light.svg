    .wire { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .pulse { fill: none; stroke: url(#g); stroke-width: 2.5; stroke-linecap: round;
             stroke-dasharray: 14 200; stroke-dashoffset: 214; animation: flow 2.1s linear infinite; }
